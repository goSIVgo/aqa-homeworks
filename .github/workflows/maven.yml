echo "name: Java CI with Maven

on:
  push:
    branches: [ main, master, lesson_7_junit_5 ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Maven
        run: mvn test" > .github\workflows\maven.yml